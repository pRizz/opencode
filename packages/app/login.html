<!doctype html>
<html lang="en" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - opencode</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="opencode-fork" content="Fork of OpenCode (pRizz/opencode)" />
    <meta name="opencode-source" content="https://github.com/pRizz/opencode" />
    <meta name="theme-color" content="#F8F7F7" />
    <meta name="theme-color" content="#131010" media="(prefers-color-scheme: dark)" />
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
    <script>
      ;(() => {
        try {
          const currentUrl = new URL(window.location.href)
          const hostname = currentUrl.hostname.trim().toLowerCase()
          const normalizedHostname = hostname.replace(/^\[(.*)\]$/, "$1")
          const skipRedirect = currentUrl.searchParams.get("no_loopback_redirect") === "1"
          const isLoopbackHost =
            normalizedHostname === "127.0.0.1" ||
            normalizedHostname === "::1" ||
            normalizedHostname === "0:0:0:0:0:0:0:1"

          if (skipRedirect || !isLoopbackHost || normalizedHostname === "localhost") {
            return
          }

          const redirectUrl = new URL(currentUrl.toString())
          redirectUrl.protocol = "http:"
          redirectUrl.hostname = "localhost"
          redirectUrl.searchParams.set("oc_loopback_redirected", "1")
          redirectUrl.searchParams.set("oc_loopback_from", normalizedHostname)
          // Use replace() so Back does not return to the loopback URL and trigger another redirect.
          window.location.replace(redirectUrl.toString())
        } catch {
          // Ignore parsing failures and continue loading the login app.
        }
      })()
    </script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/src/login/index.tsx" type="module"></script>
  </body>
</html>
